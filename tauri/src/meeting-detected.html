<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In a meeting?</title>
  <script src="scripts/ui-zoom.js"></script>
  <script src="locales/zh-CN.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="scripts/i18n.js"></script>
  <link rel="stylesheet" href="styles/ui-zoom-tokens.css">
  <style>
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 400;
      src: url('fonts/Geist-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 500;
      src: url('fonts/Geist-Medium.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 600;
      src: url('fonts/Geist-SemiBold.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      color-scheme: light dark;
      --bg:             #0D0D0B;
      --bg-hover:       #1C1C1A;
      --border-mid:     #2A2924;
      --text:           #E8E4DA;
      --text-secondary: #8C8880;
      --accent:         #30D158;
      --accent-hover:   #4ADE70;
      /* --bg (near-black) on the green accent = 9.62:1; --text (cream) on it
         is only 1.59:1, so the primary button needs its own token per
         scheme rather than reusing --bg or --text directly (WCAG 1.4.3). */
      --btn-primary-text: var(--bg);
      --red:            #FF453A;
      --red-bg:         rgba(255, 69, 58, 0.12);
      --shadow:
        0 18px 36px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:             #F8F4ED;
        --bg-hover:       #E8E2D8;
        --border-mid:     rgba(0, 0, 0, 0.13);
        --text:           #1A1916;
        --text-secondary: #6B6760;
        --accent:         #C96B4E;
        --accent-hover:   #B85A3E;
        /* --bg (cream) on coral is 3.36:1, below the 4.5:1 AA minimum for
           the button's 13px/500 label text; --text (near-black) on coral is
           4.77:1. */
        --btn-primary-text: var(--text);
        --red:            #C0392B;
        --red-bg:         rgba(192, 57, 43, 0.12);
        --shadow:
          0 18px 36px rgba(0, 0, 0, 0.12),
          inset 0 1px 0 rgba(0, 0, 0, 0.03);
      }
    }

    html, body { width: 100%; height: 100%; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* One-row pill, Notion style: icon · title/subtitle · split button.
       The window is 420x64 at rest and grows to 420x224 while the chevron
       menu is open (see setWindowHeight). */
    .card {
      position: relative;
      height: 4rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 0.625rem 0 0.875rem;
      border-radius: 1rem;
      border: 1px solid var(--border-mid);
      background: var(--bg);
      box-shadow: var(--shadow);
      animation: slideIn 200ms ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .mark {
      width: 2rem;
      height: 2rem;
      border-radius: 0.5rem;
      flex-shrink: 0;
    }

    .copy { flex: 1; min-width: 0; }

    .heading {
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle [hidden] { display: none; }

    .error-row {
      font-size: var(--text-xs);
      color: var(--red);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions { display: flex; align-items: center; flex-shrink: 0; }
    .actions[hidden] { display: none; }

    .btn {
      appearance: none;
      border: 0;
      height: 2.125rem;
      padding: 0 0.875rem;
      font: inherit;
      font-size: var(--text-body);
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn-primary {
      background: var(--accent);
      color: var(--btn-primary-text);
      border-radius: 1.0625rem 0 0 1.0625rem;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-chevron {
      background: var(--accent);
      color: var(--btn-primary-text);
      border-radius: 0 1.0625rem 1.0625rem 0;
      padding: 0 0.625rem 0 0.5rem;
      border-left: 1px solid rgba(0, 0, 0, 0.18);
      display: inline-flex;
      align-items: center;
    }
    .btn-chevron:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-chevron svg { width: 0.7rem; height: 0.7rem; fill: none; stroke: currentColor; stroke-width: 2; }
    .btn-chevron[aria-expanded="true"] svg { transform: rotate(180deg); }

    /* Dropdown under the split button, right-aligned to the card. */
    .menu {
      position: absolute;
      top: calc(4rem + 0.375rem);
      right: 0.625rem;
      min-width: 13rem;
      display: flex;
      flex-direction: column;
      padding: 0.25rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border-mid);
      background: var(--bg);
      box-shadow: var(--shadow);
    }
    .menu[hidden] { display: none; }
    .btn-menu {
      background: transparent;
      color: var(--text);
      text-align: left;
      height: 1.875rem;
      padding: 0 0.625rem;
      border-radius: 0.5rem;
      font-size: var(--text-xs);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-menu:hover:not(:disabled) { background: var(--bg-hover); }
    .menu-sep { height: 1px; margin: 0.25rem 0.375rem; background: var(--border-mid); }
  </style>
</head>
<body>
  <div class="card" role="alertdialog" aria-label="In a meeting?">
    <img class="mark" src="assets/app-icon.png" alt="" aria-hidden="true">
    <div class="copy">
      <div class="heading" id="heading"></div>
      <div class="subtitle" id="subtitle">
        <span id="app-name"></span><span id="title-row" hidden> · <span id="calendar-title"></span></span><span id="hint-row"> · <span id="hint"></span></span>
      </div>
      <div class="error-row" id="error-row" hidden><span id="error-text"></span></div>
    </div>

    <div class="actions" id="actions-primary">
      <button class="btn btn-primary" id="record-btn" type="button"></button>
      <button class="btn btn-chevron" id="snooze-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="actions-menu">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      </button>
    </div>

    <div class="menu" id="actions-menu" role="menu" hidden>
      <button class="btn btn-menu" id="not-now-btn" role="menuitem" type="button"></button>
      <div class="menu-sep" role="separator"></div>
      <button class="btn btn-menu" id="menu-not-for-call" role="menuitem" type="button"></button>
      <button class="btn btn-menu" id="menu-hour" role="menuitem" type="button"></button>
      <button class="btn btn-menu" id="menu-never" role="menuitem" type="button"></button>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const t = (key) => (window.MinutesI18n && window.MinutesI18n.t ? window.MinutesI18n.t(key) : key);

    const appNameEl = document.getElementById('app-name');
    const headingEl = document.getElementById('heading');
    const subtitleEl = document.getElementById('subtitle');
    const titleRow = document.getElementById('title-row');
    const hintRow = document.getElementById('hint-row');
    const hintEl = document.getElementById('hint');
    const calendarTitleEl = document.getElementById('calendar-title');
    const errorRow = document.getElementById('error-row');
    const errorText = document.getElementById('error-text');
    const actionsPrimary = document.getElementById('actions-primary');
    const actionsMenu = document.getElementById('actions-menu');
    const recordBtn = document.getElementById('record-btn');
    const notNowBtn = document.getElementById('not-now-btn');
    const snoozeBtn = document.getElementById('snooze-btn');
    const menuNotForCall = document.getElementById('menu-not-for-call');
    const menuHour = document.getElementById('menu-hour');
    const menuNever = document.getElementById('menu-never');

    // Window heights (logical px) at rest and with the dropdown open; the
    // Rust side creates the window at the rest size (MEETING_DETECTED_SIZE).
    const CARD_WIDTH = 420;
    const CARD_HEIGHT = 64;
    const CARD_HEIGHT_MENU = 224;

    // dismiss_ms lets Playwright shrink the 20s auto-dismiss to something a
    // test can wait on; production never sets it.
    const params = new URLSearchParams(window.location.search);
    const dismissMs = Number(params.get('dismiss_ms')) || 20000;

    let appName = '';
    let calendarTitle = null;
    let menuOpen = false;
    let closed = false;
    let autoDismissTimer = null;
    let errorTimer = null;
    let pollIntervalId = null;

    function clearTimers() {
      clearTimeout(autoDismissTimer);
      clearTimeout(errorTimer);
      clearInterval(pollIntervalId);
    }

    async function setWindowHeight(height) {
      try {
        const win = window.__TAURI__.window;
        const Size = win.LogicalSize;
        if (!Size) return; // test stub: no real window to resize
        await win.getCurrentWindow().setSize(new Size(CARD_WIDTH, height));
      } catch (error) {
        console.error('meeting-detected resize:', error);
      }
    }

    // Applies a card choice and closes. Idempotent via `closed` — whichever
    // path (button, menu item, timer) gets here first wins; the rest are
    // no-ops, matching AC-2.7's "whichever timer fires first" rule.
    async function choose(choice) {
      if (closed) return;
      closed = true;
      clearTimers();
      try {
        await invoke('cmd_meeting_detected_choice', { choice });
      } catch (error) {
        console.error('meeting-detected choice:', choice, error);
        // The backend closes the window as part of a successful choice; if
        // the choice failed it did not, and this card — always-on-top,
        // undecorated, non-focusable — has no other way out.
        await invoke('cmd_close_meeting_detected').catch((closeError) => console.error(closeError));
      }
    }

    async function closeSilently() {
      if (closed) return;
      closed = true;
      clearTimers();
      try {
        await invoke('cmd_close_meeting_detected');
      } catch (error) {
        console.error('meeting-detected close:', error);
      }
    }

    // Subtitle reads "<app> · <calendar title>" when an event matched, else
    // "<app> · Recording stays on this Mac".
    function updateSubtitle() {
      titleRow.hidden = !calendarTitle;
      hintRow.hidden = !!calendarTitle;
    }

    function showTitle(title) {
      if (!title) return;
      calendarTitle = title;
      calendarTitleEl.textContent = title;
      updateSubtitle();
    }

    function toggleMenu() {
      const open = actionsMenu.hidden;
      actionsMenu.hidden = !open;
      snoozeBtn.setAttribute('aria-expanded', String(open));
      menuOpen = open;
      setWindowHeight(open ? CARD_HEIGHT_MENU : CARD_HEIGHT);
    }

    function showError(error) {
      clearTimeout(errorTimer);
      actionsPrimary.hidden = true;
      actionsMenu.hidden = true;
      subtitleEl.hidden = true;
      errorText.textContent = `${t("Couldn't start recording")} ${String(error)}`;
      errorRow.hidden = false;
      setWindowHeight(CARD_HEIGHT);
      errorTimer = setTimeout(() => choose('not_now'), 5000);
    }

    function render() {
      headingEl.textContent = t('In a meeting?');
      appNameEl.textContent = appName;
      hintEl.textContent = t('Recording stays on this Mac');
      recordBtn.textContent = t('Record');
      notNowBtn.textContent = t('Not now');
      snoozeBtn.setAttribute('aria-label', t('Snooze'));
      snoozeBtn.title = t('Snooze');
      menuNotForCall.textContent = t('Not for this call');
      menuHour.textContent = t('1 hour');
      // Literal key form so the AC-2.15 catalog key "Never for {app}" is
      // actually read by t() — an interpolated template string can only
      // ever match a locale `patterns` regex, never this key.
      menuNever.textContent = t('Never for {app}').replace('{app}', appName);
      updateSubtitle();
    }

    async function loadPayload() {
      const tokenStr = params.get('t');
      const token = tokenStr === null ? NaN : Number(tokenStr);
      if (!Number.isFinite(token)) {
        console.warn('meeting-detected opened without staging token; closing');
        closeSilently();
        return;
      }

      let data = null;
      try {
        data = await invoke('cmd_get_meeting_detected', { token });
      } catch (error) {
        console.warn('cmd_get_meeting_detected failed:', error);
        closeSilently();
        return;
      }
      if (!data) {
        console.warn('meeting-detected token', token, 'returned no data; closing');
        closeSilently();
        return;
      }

      appName = data.appName || '';
      render();
      if (data.calendarTitle) showTitle(data.calendarTitle);
    }

    async function pollCaptureStatus() {
      try {
        const status = await invoke('cmd_capture_status');
        if (status && status.recording) closeSilently();
      } catch (error) {
        console.error('meeting-detected status poll:', error);
      }
    }

    recordBtn.addEventListener('click', async () => {
      if (closed) return;
      recordBtn.disabled = true;
      snoozeBtn.disabled = true;
      try {
        await invoke('cmd_start_recording', { intent: 'call', source: 'call_detect' });
        await choose('record');
      } catch (error) {
        recordBtn.disabled = false;
        snoozeBtn.disabled = false;
        showError(error);
      }
    });

    notNowBtn.addEventListener('click', () => choose('not_now'));
    snoozeBtn.addEventListener('click', toggleMenu);
    menuNotForCall.addEventListener('click', () => choose('snooze_call'));
    menuHour.addEventListener('click', () => choose('snooze_hour'));
    menuNever.addEventListener('click', () => choose('never'));

    listen('meeting-detected:calendar', (event) => showTitle(event?.payload?.title));

    // No blank initial render(): appName is empty until loadPayload()
    // resolves and renders itself, so the menu never briefly reads "Never
    // for " before the payload arrives.
    loadPayload();
    autoDismissTimer = setTimeout(() => choose('not_now'), dismissMs);
    pollCaptureStatus();
    pollIntervalId = setInterval(pollCaptureStatus, 1000);
  </script>
</body>
</html>
